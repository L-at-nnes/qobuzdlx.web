[package]
name = "qobuzdlx"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.85"
description = "A self-hosted web application for downloading music from Qobuz"
license = "MIT"
repository = "https://gitlab.com/L-at-nnes/qobuzdlx.web"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
futures-util = "0.3.34"
hmac = "0.13.0"
html-escape = "0.2.15"
lofty = "0.24.0"
md-5 = "0.11.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
symphonia = { version = "0.6.1", default-features = false, features = ["flac"] }
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
flacenc = "0.5.1"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }

# Argon2 is slow by design: unoptimised it would make every test that signs in take seconds
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
