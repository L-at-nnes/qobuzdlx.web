[package]
name = "qobuzdlx"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.85"
description = "A self-hosted web application for downloading music from Qobuz"
license = "MIT"
repository = "https://gitlab.com/L-at-nnes/qobuzdlx.web"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
