[package]
name = "qobuzdlx"
version = "2.0.0-dev"
edition = "2024"
rust-version = "1.85"
description = "A self-hosted web application for downloading music from Qobuz"
license = "MIT"
repository = "https://gitlab.com/L-at-nnes/qobuzdlx.web"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.34"
html-escape = "0.2.15"
lofty = "0.24.0"
md-5 = "0.11.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }
